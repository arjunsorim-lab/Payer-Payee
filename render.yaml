services:
  - type: web
    name: payer-payee
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: gunicorn backend.app:app --preload --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_DB
        value: PayerPayee
      - key: CORS_ORIGIN
        value: https://payer-payee-1.onrender.com,https://payer-payee.onrender.com
      - key: MONGODB_TIMEOUT_MS
        value: 5000
      - key: MONGODB_RETRY_SECONDS
        value: 60
      - key: SAVINGS_WORKBOOK_PATH
        value: data/claims-demo.xlsx
      - key: PRELOAD_WORKBOOK
        value: "true"
      - key: MONGODB_URI
        sync: false
